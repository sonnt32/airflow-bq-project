name: 'brainy_master'
version: '1.0.0'

require-dbt-version: ">=1.5.0"

profile: 'multi_game'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

