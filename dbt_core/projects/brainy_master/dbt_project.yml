# Project ĐỘC LẬP với annoying_puzzle/obby1 — dbt chỉ parse model-paths bên
# trong thư mục này. Thêm/sửa SQL ở đây không đụng tới project khác.
# ============================================================
models:
  brainy_master:
    +materialized: incremental
    +schema: stg
