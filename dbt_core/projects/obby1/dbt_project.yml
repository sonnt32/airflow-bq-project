name: 'obby1'
version: '1.0.0'

require-dbt-version: ">=1.5.0"

profile: 'multi_game'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Vars mặc định cho R2-R8 khi không truyền --vars.
# Ghi đè lúc chạy: dbt run --select ob1_r3_funnel_monet_ltv --vars '{"versions": ["1.0.8"]}'
vars:
  versions: []                 # [] = mọi version
  exclude_geo: ['China']       # dùng cho R3/R4
  cohort_event: 'first_open'   # dùng cho R5: 'first_open' | 'session_start'
  max_session_min: 20          # dùng cho R2

# ============================================================
# Project ĐỘC LẬP với annoying_puzzle/brainy_master — dbt chỉ parse
# model-paths bên trong thư mục này. Thêm/sửa SQL ở đây không đụng tới
# project khác.
# ============================================================
models:
  obby1:
    +materialized: table   # marts full-rebuild (không incremental)
    +schema: reports
