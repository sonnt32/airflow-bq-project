name: "{{ env_var('DBT_PROJECT_NAME') }}"
version: '1.0.0'

require-dbt-version: ">=1.5.0"

profile: 'multi_game'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# ============================================================
# Vars mặc định cho models/obby1 (R2-R8) khi không truyền --vars.
# Ghi đè lúc chạy: dbt run --select r3_funnel_monet_ltv --vars '{"versions": ["1.0.8"]}'
# Không ảnh hưởng annoying_puzzle/brainy_master — 2 game đó không dùng vars.
# ============================================================
vars:
  versions: []                 # [] = mọi version
  exclude_geo: ['China']       # dùng cho R3/R4
  cohort_event: 'first_open'   # dùng cho R5: 'first_open' | 'session_start'
  max_session_min: 20          # dùng cho R2

# ============================================================
# Cấu hình mặc định cho toàn bộ project
#
# +schema: stg → tất cả models mặc định vào dataset "stg"
#
# Nếu model nào cần vào dataset khác (vd: marts),
# override trực tiếp trong file SQL bằng config():
#
#   {{ config(
#       materialized='incremental',
#       schema='marts'
#   ) }}
#
# Macro generate_schema_name đảm bảo dbt dùng đúng tên dataset
# thay vì nối thêm dataset gốc (analytics_XXXXXXXXX_stg)
# ============================================================
models:

  # --- Game 1: Annoying Puzzle ---
  annoying_puzzle:
    +materialized: incremental -- cách incremental là thêm data mới, tăng dần mà không thay thế
    +schema: stg

  # --- Game 2: Brainy Master ---
  brainy_master:
    +materialized: incremental
    +schema: stg

  # --- Game 3: Obby 1 ---
  obby1:
    +materialized: table   # marts full-rebuild (không incremental, khác 2 game kia)
    +schema: reports        # -> dataset obby1_layer2_reports (qua macro generate_schema_name)

  # --- Thêm game mới: copy block, đổi tên ---
  # game_b:
  #   +materialized: incremental
  #   +schema: stg